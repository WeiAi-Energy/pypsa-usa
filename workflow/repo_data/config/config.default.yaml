# PyPSA-USA Default Configuration File for developing and testing county transmission network from Reeds
run:
  name: "Default" # use this to keep track of runs with different settings
  disable_progressbar: false # set to true to disable the progressbar
  shared_resources: false # set to true to share the default resources across runs
  shared_cutouts: true # set to true to share the default cutout(s) across runs
  validation: false # set to true to run back-casting plots

# docs :
scenario:
  interconnect: [western] #"usa|texas|western|eastern"
  clusters: [33]
  simpl: [75]
  opts: [REM-3h]
  ll: [v1.0]
  sector: E
  planning_horizons: [2030, 2040, 2050]    #(2018-2023, 2030, 2040, 2050)
  cost_year: 2030
foresight:  'perfect' # myopic, perfect

model_topology:
  transmission_network: 'reeds' # [reeds, tamu]
  topological_boundaries: 'reeds_zone' # [county, reeds_zone, state]
  interface_transmission_limits: false
  include: # mixed zone types not supported
    # reeds_zone: []
    # reeds_state: ['CA']
    # reeds_ba: []
  aggregate: # eligible keys: [reeds_zone, trans_reg]
    # trans_grp: []
    # reeds_zone: []


# docs :
enable:
  custom_busmap: false

renewable_weather_years: [2007, 2008, 2009, 2010, 2011, 2012, 2013, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023]
snapshots:
  start: "2019-01-01"
  end: "2020-01-01"
  inclusive: "left"

# For multiple planning horizons, only specify the month and day - the year will automatically match each planning horizon (e.g., planning_horizons: [2030, 2040, 2050])
renewable_snapshots:
  start_month: 1
  start_day: 1
  end_month: 12
  end_day: 31
  end_inclusive: true  # if true, includes the end day; if false, stops before end day

# docs :
electricity:
  conventional_carriers: [nuclear, oil, OCGT, CCGT, coal, geothermal, biomass, waste] # Choose the conventional plant types to include in network
  renewable_carriers: [onwind, offwind_floating, solar, hydro] # Choose the renewable plant types to include in network
  retirement: economic # "economic" or "technical"
  add_existing_phs: false
  add_extendable_tes: false
  SAFE_reservemargin: 0.14
  regional_Co2_limits: 'config/policy_constraints/regional_Co2_limits.csv'
  technology_capacity_targets: 'repo_data/policy/technology_capacity_targets.csv'
  portfolio_standards: 'config/policy_constraints/portfolio_standards.csv'
  SAFE_regional_reservemargins: 'config/policy_constraints/SAFE_regional_prm.csv'
  transmission_interface_limits: 'config/policy_constraints/transmission_interface_limits.csv'

  post_2032_gas_average_power_limit: false # if true, cap weighted annual average dispatch of post-2032 CCGT/OCGT at 40% of nameplate capacity

  erm:  # Energy Reserve Margin - used when ERM opt is enabled
    all: 0.15  # 15% reserve margin for all regions (default)

  extendable_carriers:
    Generator: [solar, onwind, offwind_floating, OCGT, CCGT, CCGT-95CCS, coal, nuclear, hydrogen_ct] #include CCGT-CCS
    StorageUnit: [4hr_battery_storage, 8hr_battery_storage] # [Xhr-battery-storage (2-10 hours)]
    Store: []
    Link: [] 

  demand:
    profile: eer
    distribution_losses:
      enable: true
      pct: 0.05

flexible_electrolysis:
  enable: true
  annual_hydrogen_twh: 1512
  accounting_region: h2ptcreg # h2ptcreg: one H2 balance per 45V PTC region | nation: a single national H2 balance



# docs :
conventional:
  unit_commitment: false
  must_run: false
  gas_fuel_price: 15 # $/MWh_th natural gas fuel price applied to all gas-fueled generators (OCGT, CCGT, and their -CCS variants)

# docs :
lines:
  s_max_pu: 0.7
  s_nom_max: .inf
  max_extension: 20000 #MW
  length_factor: 1.0 # routed-length / great-circle. ReEDS prices already embed
    # route detour, so update_transmission_costs divides this back out; it must
    # match the factor used by every aggregation pass or impedance and cost shift.
  voltage_factor: true # false prices every AC line at the 500 kV reference cost
  convert_lines_to_line_x:
    enable: false


# docs :
links:
  p_max_pu: 1.0
  p_nom_max: .inf
  max_extension: 20000 #MW

# docs :
costs:
  atb:
    model_case: "Market" # Market, R&D
    scenario: "Moderate" # Advanced, Conservative, Moderate
  aeo:
    scenario: "reference" # reference, high, low
  social_discount_rate: 0.02
  min_year: # {carrier: year}
    hydrogen_ct: 2040
  max_growth: # {carrier: {base:, rate:}}

# Regional OVERNIGHT-capex multipliers from NREL ReEDS reg_cap_cost_diff (county-level,
# applied to the listed techs' overnight capex only, never FOM/VOM). Buses are finer
# than county resolution, so each is matched to the geographically nearest county the
# ReEDS table covers. Wind/solar are intentionally absent: ReEDS publishes no wind/UPV
# column, so their regional cost comes from the per-site ReEDS interconnection cost
# (cost_trans_usd_per_mw) added to overnight capex in add_electricity instead.
# Each technology is corrected where it is created: wind/solar in add_electricity,
# everything else in add_extra_components.
cost_multipliers:
  enable: true
  column_to_tech:
    BATTERY|PVB: [battery, 2hr_battery_storage, 4hr_battery_storage, 6hr_battery_storage, 8hr_battery_storage, 10hr_battery_storage]
    COAL|BIO: [biomass-CCS]
    COMBINED_CYCLE|FUEL_CELL: [CCGT, CCGT-95CCS, CCGT-97CCS, hydrogen_ct, tes]
    COMBUSTION_TURBINE|CONSUME|LFILL|OGS: [OCGT, electrolysis]
    NUCLEAR: [nuclear]

# docs :
clustering:
  simplify_network:
    weighting_strategy: demand-capacity # choose from: [population, demand-capacity]
    to_substations: false # network is simplified to nodes with positive or negative power injection (i.e. substations or offwind connections)
    algorithm: kmeans # choose from: [hac, kmeans]
    feature: solar+onwind-time # only for hac. choose from: [solar+onwind-time, solar+onwind-cap, solar-time, solar-cap, solar+offwind-cap] etc.
  aggregation_strategies:
    generators:
      build_year: 'capacity_weighted_average'
      lifetime: 'capacity_weighted_average'
      start_up_cost: 'capacity_weighted_average'
      min_up_time: 'capacity_weighted_average'
      min_down_time: 'capacity_weighted_average'
      ramp_limit_up: max
      ramp_limit_down: max
      committable: any
      vom_cost: mean
      fuel_cost: mean
      heat_rate: mean
  temporal:
    resolution_elec: false
    resolution_sector: false
    representative_periods:
      enable: true
      period_length: 14  # days; one tsam run, so representative and extreme periods share it
      number: 2
      include_extreme: [demand_max, solar_min, wind_min]

focus_weights:

# docs :
solving:
  #tmpdir: "path/to/tmp"
  options:
    load_shedding: false
    clip_p_max_pu: 1.e-2
    noisy_costs: true
    skip_iterations: true
    rolling_horizon: false
    seed: 123
    # options that go into the optimize function
    track_iterations: false
    min_iterations: 4
    max_iterations: 6
    scheme: slp
    trust_region: true
    transmission_losses: 2
    iterative_method: lossy
    linearized_unit_commitment: true
    horizon: 8760
    assign_all_duals: true


  solver:
    name: gurobi
    options: gurobi-default

  solver_options:
    highs-default:
      # refer to https://ergo-code.github.io/HiGHS/options/definitions.html#solver
      threads: 4
      solver: "ipm"
      run_crossover: "off"
      small_matrix_value: 1e-6
      large_matrix_value: 1e9
      primal_feasibility_tolerance: 1e-5
      dual_feasibility_tolerance: 1e-5
      ipm_optimality_tolerance: 1e-4
      parallel: "on"
      random_seed: 123
    gurobi-default:
      threads: 8
      method: 2 # barrier
      crossover: 0
      BarHomogeneous: 1     # Use homogeneous barrier if standard does not converge
      BarConvTol: 1.e-5
      OptimalityTol: 1.e-4
      FeasibilityTol: 1.e-3
      ScaleFlag: 1
      Seed: 123
      AggFill: 0
      PreDual: 0
      GURO_PAR_BARDENSETHRESH: 200
    gurobi-numeric-focus:
      name: gurobi
      NumericFocus: 3       # Favour numeric stability over speed
      method: 2             # barrier
      crossover: 0          # do not use crossover
      BarHomogeneous: 1     # Use homogeneous barrier if standard does not converge
      BarConvTol: 1.e-5
      FeasibilityTol: 1.e-4
      OptimalityTol: 1.e-4
      ObjScale: -0.5
      threads: 8
      Seed: 123
    gurobi-fallback:        # Use gurobi defaults
      name: gurobi
      crossover: 0
      BarHomogeneous: 1     # Use homogeneous barrier if standard does not converge
      BarConvTol: 1.e-5
      FeasibilityTol: 1.e-5
      OptimalityTol: 1.e-5
      Seed: 123
      threads: 8
    cplex-default:
      threads: 4
      lpmethod: 4 # barrier
      solutiontype: 2 # non basic solution, ie no crossover
      barrier.convergetol: 1.e-5
      feasopt.tolerance: 1.e-6
    cbc-default: {} # Used in CI
    glpk-default: {} # Used in CI

  mem: 30000 #memory in MB; 20 GB enough for 50+B+I+H2; 100 GB for 181+B+I+H2
  walltime: "12:00:00"

walltime:
  build_renewable_profiles: '04:00:00'
  select_representative_periods: '04:00:00'
  build_region_temperature: '04:00:00'
  build_fuel_prices: '00:20:00'
  add_demand: '02:00:00'
  add_electricity: '04:00:00'
  simplify_network: '05:00:00'
  solve_network: '20:00:00'

# docs :
custom_files:
  activate: false
  files_path: ''
  network_name: ''
